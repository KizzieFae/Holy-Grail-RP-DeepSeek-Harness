name: Holy Grail RP issue
description: Canonical Type, Layer, Pattern status, and evidence (matches governance/rp-app/issue-tracking-workflow.md §D–§I).
title: "[BUG] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Contract:** `governance/rp-app/issue-tracking-workflow.md` (**§D** template, **§E** Type, **§F** Layer, **§G** titles, **§H** status, **§I** pattern). Runtime RP architecture remains in `autogen_rp/python/rp_app/ARCHITECTURE.md`.

        **Audit wording:** Do not conflate **Issue #59** applicability (inventory signal class) with **Issue #70** engineering role (telemetry / guardrail / aggregation / detector). Interpretation: `autogen_rp/python/rp_app/AUDIT_DOCUMENTATION.md` → **Issue #70 — Engineering-role taxonomy (Tier 1 kernel)** and the **Audit signal applicability** contract.

        **Cursor workflow bootstrap (system instructions; canonical policy in `governance/policies/cursor-workflow-layer.md`, always applied via `.cursor/rules/2-ai-system-start.mdc`):**

        1. **Activation synchronization** — When **evidence extraction** or **analysis** on an issue **begins**, set **RP System Workflow** **Project Status** to **In Progress** and **Workflow** to **Investigating** (aligned with **`Current status: investigating`** per **§B.3**). **Do not** require this update when only **browsing** issues or **selecting** the next task without starting extraction or analysis.

        2. **Delegation** — Cursor (implementation) **must not** perform **analysis** or **evidence extraction** directly; **always** produce a **handoff prompt** for the **analysis AI** so that analysis is externalized. Handoffs are **transport only**: if facts exist only in a handoff and not in the issue body/comments, the workflow is **invalid** until copied to the Issue (**§B.5**).

        3. **Fresh-chat** — On the **first** reply in a new chat: rebuild minimal context, tie in relevant issue(s), emit a concise **SYSTEM UNDERSTANDING REPORT** (target **4–8 lines** of substantive summary); **no** analysis before that step.

        **Execution stages vs selection:** **`Current status:`** and **Workflow** are **execution stages** (**§B.3**). **Phase-first selection** (choose batch → filter → order by **Priority**) is an external **process rule** only (**§B.0**, **§B.5**). **Priority** (P0–P3) lives on the **RP System Workflow** project when enabled—not a **Type**. **`maintenance`** is an optional **label** on **quality** items, not a type.

        **Session boundary:** Before ending a session or switching chats, add an **Issue comment** with progress and next step; **Active Context** in chat must **derive** from GitHub, not replace it (**§B.5**, `governance/policies/project-behavior-holy-grail.md`).

        Set the **title** prefix to `[QUALITY]` or `[DESIGN_GAP]` when **Type** is not **bug**.

        **After submit (mandatory):** Add **labels** (**§C**), add this issue to the **RP System Workflow** project, set **Project Status** + **Workflow** per **§B.3** (defaults for **`Current status: open`**: **Todo** / **Ready**), and set a **non-empty Priority** (typically **P3** until triaged) when the project defines it (**§B.5**). **§B.2:** Run **`gh issue view <N> --json number,state,labels,projectItems`** **and** prove **Priority** with **`gh project item-list`**, the **Projects** UI, or **GraphQL**—**`projectItems` JSON alone is not enough**. Missing **Priority** fails completion the same way as other required project metadata. If **Priority** matters to the task, add **one line** in your completion note confirming it still applies or that you changed it (and why). See **§B.1**–**§B.6**.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One short paragraph.
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: PRD/architecture authority — see governance/rp-app/issue-tracking-workflow.md §E.
      options:
        - bug
        - quality
        - design_gap
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Layer (primary)
      description: One value only. If other, fill Justification + Intended final layer below. See governance/rp-app/issue-tracking-workflow.md §F.
      options:
        - consequence_classification
        - continuity_state
        - progression
        - orchestration
        - response_validation
        - grounding
        - perception
        - memory
        - rendering
        - audit_simulation
        - application_infrastructure
        - other
    validations:
      required: true

  - type: textarea
    id: other_fields
    attributes:
      label: If Layer is `other` — justification and intended final Layer
      description: If Layer is not `other`, write `n/a`.
    validations:
      required: true

  - type: dropdown
    id: pattern_status
    attributes:
      label: Pattern status
      description: See governance/rp-app/issue-tracking-workflow.md §I.
      options:
        - single_instance
        - potential_pattern
        - confirmed_pattern
    validations:
      required: true

  - type: dropdown
    id: current_status
    attributes:
      label: Current status
      description: Single active value; transitions in governance/rp-app/issue-tracking-workflow.md §H.
      options:
        - open
        - investigating
        - consensus_reached
        - implemented
        - validated
        - closed
        - monitor
        - wont_fix
    validations:
      required: true

  - type: input
    id: scenario_id
    attributes:
      label: Evidence — Scenario id (mandatory)
    validations:
      required: true

  - type: input
    id: audit_path
    attributes:
      label: Evidence — Audit session path (mandatory)
      description: Repo-relative or unambiguous path under rp_audits.
    validations:
      required: true

  - type: input
    id: turn_index
    attributes:
      label: Evidence — Turn index (mandatory or n/a)
      description: Turn index, or `n/a` with reason in Evidence (preferred) if not applicable.
    validations:
      required: true

  - type: textarea
    id: evidence_preferred
    attributes:
      label: Evidence (preferred)
      description: Structured move excerpt; consequence output; continuity snapshot excerpt.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Cite PRD/architecture when Type is bug or design_gap.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true

  - type: textarea
    id: reasoning
    attributes:
      label: Deterministic reasoning
      description: Why observed violates expected (fields, rules, code path).
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: System impact
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: e.g. no LLM-only fix; no prompt workaround; continuity authoritative — or `none`.
    validations:
      required: true

  - type: textarea
    id: modules
    attributes:
      label: Affected modules
      description: Concrete file paths.
    validations:
      required: true

  - type: textarea
    id: validation_criteria
    attributes:
      label: Validation criteria
    validations:
      required: true

  - type: checkboxes
    id: documentation
    attributes:
      label: Documentation before closure
      description: Complete before setting terminal closed status.
      options:
        - label: Documentation reviewed and updated where behavior or contracts changed (list files in a closing comment).
          required: false
