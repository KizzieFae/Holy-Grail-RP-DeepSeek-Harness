# Minimal RP-oriented DSH composition for the V2 boundary prototype.
# Boot is programmatic (see src/character-inference-slice.ts); this file documents
# the intended plugin spine without coding-agent tools (bash/editor/fs/sandbox).

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agent-registry
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# Mock LLM adapter and Holy Grail boundary orchestration are registered in code
# (prototype-only) rather than as permanent Cordis plugins.
