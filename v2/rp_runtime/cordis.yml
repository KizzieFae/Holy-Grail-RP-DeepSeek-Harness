# Minimal RP-oriented DSH composition for the V2 runtime.

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agent-registry
  name: '@deepseek-ai/dsh-agent'

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []

# Holy Grail RP runtime orchestration is provided by the in-repo Cordis service:
# v2/rp_runtime/src/plugins/hg-rp-runtime/service.mjs (HolyGrailRpRuntime)
