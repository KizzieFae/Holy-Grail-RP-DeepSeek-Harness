# Project-owned binding values (Issue #45).
# Late-bound: consumed at execution/analysis time, not resolved at template sync.
# Do not add template pins, sync state, checksums, manifests, or path-map data here.

[github]
repository = "KizzieFae/Holy-Grail-RP-DeepSeek-Harness"
upstream_repository = "KizzieFae/Holy_Grail_RP"
project_owner = "KizzieFae"
project_number = 10
project_name = "Holy Grail RP — DSH"

[agents]
canonical_entrypoint = "AGENTS.md"

[docs]
# Destination for template workflow docs when synced from development-system-template.
template_workflow_docs_destination = "docs/"

[cursor_rules]
workspace_root_rules = ".cursor/rules/"

[issue_tracking]
# GitHub Issues / Projects workflow body (§A–§K) — canonical under governance/
issue_workflow_doc = "governance/sources/issue-tracking-workflow.md"

[issue_templates]
active_pack = "holy_grail_rp"
config_path = ".github/ISSUE_TEMPLATE/config.yml"
primary_form = ".github/ISSUE_TEMPLATE/holy_grail_rp.yml"
