# Template sync manifest and meta configuration (Issue #45).
# No runtime binding values here — those live in bindings/bindings.toml.

[template]
repository = "https://github.com/KizzieFae/development-system-template"
# Set to a commit SHA or tag when this project pins a template revision.
pinned_revision = ""
# Optional: last revision successfully reconciled (maintainer-maintained).
last_reconciled_revision = ""

# Root .cursor/rules/: only listed basenames may be overwritten by template sync.
# Any other file in that directory is project-owned and must not be overwritten.
# Portable 2-AI adapter contract: these four wrappers must exist at repo root.
[[root_cursor_rule_files]]
basename = "2-ai-system-start.mdc"
classification = "template_managed"

[[root_cursor_rule_files]]
basename = "github-issues.mdc"
classification = "template_managed"

[[root_cursor_rule_files]]
basename = "github-project-usage.mdc"
classification = "template_managed"

[[root_cursor_rule_files]]
basename = "project-behavior.mdc"
classification = "template_managed"

# .github/ISSUE_TEMPLATE/: per-file ownership for sync safety.
[[github_issue_template_files]]
basename = "bug.md"
classification = "template_managed"

[[github_issue_template_files]]
basename = "general-issue.md"
classification = "template_managed"

[[github_issue_template_files]]
basename = "holy_grail_rp.yml"
classification = "project_owned"

[[github_issue_template_files]]
basename = "config.yml"
classification = "project_owned"

# Docs surfaces: template pack vs fork-owned subtree.
[[docs_surfaces]]
name = "template_workflow_docs"
template_prefix = "docs/"
destination_prefix = "docs/"
classification = "template_managed"

# ---------------------------------------------------------------------------
# Governance policy corpus (Issue #45 Stage 3). Canonical markdown included
# by Cursor stubs under `.cursor/rules/`.
# No binding values or template pins belong in these paths.
# ---------------------------------------------------------------------------

[[governance_policy_documents]]
path = "governance/execution/cursor-workflow-layer.md"
role = "cursor_bootstrap_dual_ai_workflow"

[[governance_policy_documents]]
path = "governance/sources/project-behavior-holy-grail.md"
role = "repo_wide_tracking_and_docs_routing"

[[governance_policy_documents]]
path = "governance/execution/github-issues.md"
role = "github_cli_issue_filing"

[[governance_policy_documents]]
path = "governance/execution/rp-app-guidance.md"
role = "rp_app_subtree_guidance"

[[governance_policy_documents]]
path = "governance/execution/architecture-protection.md"
role = "python_architecture_guardrails"

[[governance_policy_documents]]
path = "governance/execution/testing-expectations.md"
role = "python_testing_expectations"

[[governance_policy_documents]]
path = "governance/sources/issue-tracking-workflow.md"
role = "github_issues_projects_workflow_spec"

[[governance_policy_documents]]
path = "governance/sources/holy-grail-prd.md"
role = "governance_product_requirements"

[[governance_policy_documents]]
path = "governance/sources/architecture-overview.md"
role = "governance_architecture_overview"
